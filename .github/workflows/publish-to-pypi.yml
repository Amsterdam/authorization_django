name: Publish to PyPI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.*'

jobs:
  publish-to-pypi:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/datapunt-authorization-django/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.14

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
