name: CI Testing
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
    - main

jobs:
  test:
    name: "Python ${{ matrix.python }} Django ${{ matrix.django }}"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      # max-parallel: 8  # default is max available
      fail-fast: false
      matrix:
        include:
          # Django 4.2
          - django: "4.2"
            django_group: "django42"
            python: "3.10"
          - django: "4.2"
            django_group: "django42"
            python: "3.11"
          # Django 5.2
          - django: "5.2"
            django_group: "django52"
            python: "3.12"
          - django: "5.2"
            django_group: "django52"
            python: "3.13"
          - django: "5.2"
            django_group: "django52"
            python: "3.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install Packages
        run: |
          uv sync --python ${{ matrix.python }} --extra tests --group ${{ matrix.django_group }} --no-default-groups

      - name: Run Tests
        run: |
          echo "Python ${{ matrix.python }} / Django ${{ matrix.django }}"
          uv run --no-sync pytest --cov-config=pyproject.toml --cov-report=term-missing
        continue-on-error: ${{ contains(matrix.django, 'b') }}  # allow failing on e.g. 'django: "5.2b1"'
