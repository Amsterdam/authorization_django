[build-system]
requires = ["uv_build>=0.8.13,<0.9"]
build-backend = "uv_build"

[project]
name = "datapunt-authorization-django"
version = "2.1.1"
description = "Datapunt authorization check for Django"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Amsterdam Datapunt", email = "datapunt@amsterdam.nl" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=4.2",
    "requests>=2.34.2",
    "jwcrypto>=1.5.8",
]

[project.urls]
Homepage = "https://github.com/Amsterdam/authorization_django"

[project.optional-dependencies]
tests = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.12.0",
    "requests_mock==1.12.1",
]
extended = [
    "djangorestframework==3.17.2",
    "drf-spectacular==0.30.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.12.0",
    "requests_mock==1.12.1",
]

[tool.uv.build-backend]
module-name = "authorization_django"
module-root = ""
source-include = ["tests/**"]

# ==== pytest ====
[tool.pytest.ini_options]
xfail_strict = true
minversion = "9.0"
django_find_project = false
pythonpath = "."
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--ds=tests.settings",
    "--cov=authorization_django",
    "--cov-report=term",
    "--cov-fail-under=83",
]

# ==== Coverage ====
[tool.coverage.run]
branch = true
source = ["authorization_django"]
omit = [
    "*/migrations/*.py",
    "*/test*.py",
    "*/tests/*",
]
#plugins = ["django_coverage_plugin"]


# ==== black ====
[tool.black]
line-length = 99
target-version = ["py39"]

# ==== ruff ====
[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "B", # flake8-bugbear
    "C90", # mccabe
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "RET", # flake8-return (partially)
    # "PT",  # flake8-pytest-style
    # "TCH",  # flake8-type-checking (moves import to `if typing.TYPE_CHECKING`)
    # "ERA",  # eradicate (commented out code)
    # "TRY",  # tryceratops
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "INT", # flake8-gettext
    "FLY", # flynt (fixes unneeded static string joins)
    "UP", # pyupgrade
    "S", # security (bugbear)
    "RUF010", # ruff: fix f"{str(..)}" usage
    "RUF013", # ruff: fix annotations for =None arguments
]
ignore = [
    "S311", # allow random.randint()
    "DJ001", # allow models.CharField(null=True)
    "SIM105", # enforcing contextlib.suppress() instead of try..catch
    "RET501", # unnecessary-return-none
    "RET505", # superfluous-else-return
    "RET505", # superfluous-else-return
    "RET506", # superfluous-else-raise
    "RET507", # superfluous-else-continue
    "RET508", # superfluous-else-break
    # Ideally fixed later:
    "E501", # line too long (=comments/long strings)
    "S101", # assert statement
    "S607", # subprocess partial path
    "BLE001", # blind "except Exception"
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-gettext]
extend-function-names = ["gettext_lazy", "ngettext_lazy", "pgettext", "pgettext_lazy", "npgettext", "npgettext_lazy"]

[tool.ruff.lint.isort]
known-first-party = ["authorization_django"]
#required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S314", "S320", "S608"]  # allow asserts, hardcoded passwords, lxml parsing, SQL variables
